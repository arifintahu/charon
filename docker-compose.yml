services:
  postgres:
    image: postgres:17-alpine
    container_name: charon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: charon
      POSTGRES_PASSWORD: charon
      POSTGRES_DB: charon
    ports:
      - "5432:5432"
    volumes:
      - charon-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U charon -d charon"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  charon-pgdata:
